[pytest]
# Run from the backend/ root so `import faraid_engine` / `faraid_web` resolve without
# installing the packages. Neither has a Django dependency (CLAUDE.md), so these tests
# need no Django settings — and they cover exactly the code the browser build ships.
# Django-specific HTTP tests live in api/tests.py: `python manage.py test api`.
testpaths = faraid_engine/tests faraid_web/tests
python_files = test_*.py
addopts = -q
