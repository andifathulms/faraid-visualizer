# FaraidVisualizer — local stack (Postgres + Django/DRF backend + Next.js frontend).
# Host ports are configurable via .env (FRONTEND_HOST_PORT / BACKEND_HOST_PORT) so the
# stack can dodge occupied ports; sane defaults (3000 / 8000) are baked in.
#
#   docker compose up --build -d
#   Frontend → http://localhost:${FRONTEND_HOST_PORT:-3000}   (static, self-contained)
#   Backend  → http://localhost:${BACKEND_HOST_PORT:-8000}/api/health/
#
# The frontend no longer depends on the backend: it runs the same rule engine in the
# browser. The backend still serves the REST API, the Django admin over the citation
# tables, and the validation bank.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faraid
      POSTGRES_PASSWORD: faraid
      POSTGRES_DB: faraid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faraid -d faraid"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://faraid:faraid@db:5432/faraid
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-dev-secret-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_HOST_PORT:-3000},http://127.0.0.1:${FRONTEND_HOST_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  # Static site — the rule engine runs in the browser (Pyodide), so this serves plain
  # files via nginx and does not talk to the backend. The build context is the repo root
  # because the frontend bundles the Python engine out of backend/.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  pgdata:
